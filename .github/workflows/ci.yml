name: Moodle Plugin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CCEADFONTSIZE_READ_TOKEN: ${{ secrets.CCEADFONTSIZE_READ_TOKEN }}
    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_501_STABLE
            php: '8.2'
            database: pgsql
          - moodle-branch: MOODLE_501_STABLE
            php: '8.4'
            database: mariadb
          - moodle-branch: MOODLE_502_STABLE
            php: '8.3'
            database: pgsql
          - moodle-branch: MOODLE_502_STABLE
            php: '8.4'
            database: mariadb
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - name: Check out companion font size plugin
        if: ${{ env.CCEADFONTSIZE_READ_TOKEN != '' }}
        uses: actions/checkout@v6
        with:
          repository: jPerpetuo/moodle-tiny-cceadfontsize
          token: ${{ env.CCEADFONTSIZE_READ_TOKEN }}
          path: extra-plugins/tiny_cceadfontsize
          persist-credentials: false
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none
      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
      - name: Install Moodle and plugin
        run: |
          if [ -d ./extra-plugins ]; then
            moodle-plugin-ci install --plugin ./plugin --extra-plugins ./extra-plugins --db-host=127.0.0.1
          else
            moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
          fi
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      - name: PHP lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint
      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: moodle-plugin-ci phpmd
      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0
      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - name: Validate plugin
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate
      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints
      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0
      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome
      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

  lifecycle:
    name: Lifecycle (${{ matrix.moodle-branch }}, ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - moodle-branch: MOODLE_501_STABLE
            php: '8.2'
            database: pgsql
          - moodle-branch: MOODLE_501_STABLE
            php: '8.4'
            database: mariadb
          - moodle-branch: MOODLE_502_STABLE
            php: '8.3'
            database: pgsql
          - moodle-branch: MOODLE_502_STABLE
            php: '8.4'
            database: mariadb

    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin && pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin && pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: Uninstall plugin
        run: |
          cd moodle
          php admin/cli/uninstall_plugins.php --plugins=tiny_cceadfontfamily --run --showdebugging

      - name: Verify plugin is uninstalled
        run: |
          cd moodle
          php -r 'define("CLI_SCRIPT", true); require("config.php"); $plugin = core_plugin_manager::instance()->get_plugin_info("tiny_cceadfontfamily"); if (!$plugin || $plugin->get_status() !== core_plugin_manager::PLUGIN_STATUS_NEW) { fwrite(STDERR, "The plugin is not in the expected uninstalled state.\n"); exit(1); }'
